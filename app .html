<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Biblioteca Steam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --surface2: #1e2330;
    --border: #2a3040;
    --accent: #4f9eff;
    --accent2: #7c5cfc;
    --green: #3ddc84;
    --yellow: #f5c542;
    --red: #ff5c5c;
    --text: #e8eaf0;
    --muted: #7a8399;
    --card-hover: #242b3d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #0d0f14 0%, #161d2e 50%, #0d1520 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 20px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-top {
    display: flex; align-items: center; gap: 16px; margin-bottom: 18px;
  }

  .steam-logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stats-bar {
    display: flex; gap: 20px; font-size: 12px; color: var(--muted);
    margin-bottom: 16px; flex-wrap: wrap;
  }

  .stats-bar span { display: flex; align-items: center; gap: 5px; }
  .stats-bar b { color: var(--text); font-size: 13px; }

  /* ── SEARCH & FILTERS ── */
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }

  .search-wrap {
    position: relative; flex: 1; min-width: 220px;
  }

  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }

  #searchInput {
    width: 100%; padding: 9px 12px 9px 38px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--muted); }

  .filter-btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted); font-size: 13px;
    cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent); color: var(--accent); background: rgba(79,158,255,.08);
  }

  /* ── GRID ── */
  main { padding: 24px 32px; }

  .result-info {
    font-size: 13px; color: var(--muted); margin-bottom: 16px;
  }
  .result-info b { color: var(--text); }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  /* ── GAME CARD ── */
  .game-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .18s, border-color .18s, box-shadow .18s;
    position: relative;
  }
  .game-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 28px rgba(79,158,255,.15);
  }

  .card-thumb {
    width: 100%; height: 100px;
    background: linear-gradient(135deg, var(--surface2), var(--border));
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; position: relative; overflow: hidden;
  }

  .card-thumb img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
  }

  .tier-badge {
    position: absolute; top: 8px; right: 8px;
    padding: 2px 7px; border-radius: 20px;
    font-size: 10px; font-weight: 600; letter-spacing: .3px;
  }
  .tier-excellent { background: rgba(61,220,132,.2); color: var(--green); border: 1px solid rgba(61,220,132,.3); }
  .tier-good      { background: rgba(245,197,66,.2);  color: var(--yellow); border: 1px solid rgba(245,197,66,.3); }
  .tier-bad       { background: rgba(255,92,92,.2);   color: var(--red);   border: 1px solid rgba(255,92,92,.3); }
  .tier-unrated   { background: rgba(122,131,153,.15); color: var(--muted); border: 1px solid rgba(122,131,153,.2); }

  .card-body { padding: 10px 12px 12px; }

  .card-title {
    font-size: 13px; font-weight: 600; line-height: 1.35;
    margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-genre {
    font-size: 11px; color: var(--muted); margin-bottom: 8px;
  }

  .card-score {
    display: flex; align-items: center; gap: 6px;
  }

  .stars { display: flex; gap: 2px; }
  .star { font-size: 11px; }
  .star.filled { color: var(--yellow); }
  .star.empty  { color: var(--border); }

  .score-num {
    font-size: 12px; font-weight: 700; color: var(--yellow);
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75); z-index: 1000;
    align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 620px;
    max-height: 88vh; overflow-y: auto;
    position: relative;
    animation: modalIn .2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(.94) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-header {
    padding: 22px 22px 0;
    display: flex; align-items: flex-start; gap: 14px;
  }

  .modal-icon {
    width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--surface2), var(--border));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; overflow: hidden;
  }
  .modal-icon img { width: 100%; height: 100%; object-fit: cover; }

  .modal-title-block { flex: 1; }

  .modal-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700; line-height: 1.2;
    margin-bottom: 6px;
  }

  .modal-tags {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px;
  }

  .tag {
    padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 500;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted);
  }
  .tag.genre-tag { color: var(--accent); border-color: rgba(79,158,255,.3); background: rgba(79,158,255,.08); }

  .modal-close {
    position: absolute; top: 14px; right: 14px;
    background: var(--surface2); border: 1px solid var(--border);
    width: 30px; height: 30px; border-radius: 8px;
    cursor: pointer; color: var(--muted); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 20px 22px 24px; }

  .modal-score-row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px; background: var(--surface2);
    border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--border);
  }

  .big-score {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 38px; font-weight: 700; color: var(--yellow);
    line-height: 1;
  }

  .score-details { flex: 1; }
  .score-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .score-bar-wrap {
    height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
  }
  .score-bar { height: 100%; border-radius: 3px; transition: width 1s ease; }

  .verdict {
    font-size: 13px; font-weight: 600; color: var(--green); margin-top: 4px;
  }

  .fps-badge {
    text-align: center;
  }
  .fps-value {
    font-size: 13px; font-weight: 700; padding: 4px 10px;
    border-radius: 6px; display: inline-block;
  }
  .fps-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .modal-description {
    font-size: 14px; line-height: 1.7; color: #c8cdd8;
    margin-bottom: 16px; min-height: 80px;
  }

  .loading-state {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 14px; padding: 20px 0;
  }

  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-highlights {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-top: 12px;
  }

  .highlight-item {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .highlight-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .highlight-value { font-size: 13px; font-weight: 600; color: var(--text); }

  .perf-section {
    margin-top: 14px; padding: 12px 14px;
    background: rgba(79,158,255,.06); border: 1px solid rgba(79,158,255,.15);
    border-radius: 10px;
  }
  .perf-title { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .perf-text { font-size: 13px; color: #a0a8bb; line-height: 1.5; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @media (max-width: 600px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .games-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .modal-highlights { grid-template-columns: 1fr; }
  }
</style>
</head>

let loadedGames = new Map();

// ── RENDER FUNCTIONS ──────────────────────────────────
function getScore(name) { return SCORES[name] || null; }

function scoreColor(s) {
  if (!s) return 'var(--muted)';
  if (s >= 8.5) return 'var(--green)';
  if (s >= 7.0) return 'var(--yellow)';
  return 'var(--red)';
}

function verdictText(s) {
  if (!s) return '';
  if (s >= 9.0) return '🏆 Obra maestra';
  if (s >= 8.0) return '👍 Muy recomendado';
  if (s >= 7.0) return '✅ Buena opción';
  if (s >= 6.0) return '😐 Regular';
  return '⚠️ Divisivo';
}

function tierLabel(t) {
  return { excellent: '✅ 60+ FPS', good: '⚠️ 30-60 FPS', bad: '❌ <30 FPS', unrated: '📊 Sin datos' }[t];
}
function tierClass(t) {
  return { excellent: 'tier-excellent', good: 'tier-good', bad: 'tier-bad', unrated: 'tier-unrated' }[t];
}

function renderStars(score) {
  if (!score) return '<span style="color:var(--muted);font-size:11px">Sin puntuación</span>';
  const full = Math.round(score / 2);
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i <= full ? 'filled' : 'empty'}">★</span>`;
  }
  return html;
}

function filteredGames() {
  return GAMES.filter(g => {
    const matchFilter = currentFilter === 'all' || g.tier === currentFilter;
    const matchSearch = g.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                        g.genre.toLowerCase().includes(currentSearch.toLowerCase());
    return matchFilter && matchSearch;
  });
}

function renderGrid() {
  const games = filteredGames();
  const grid = document.getElementById('gamesGrid');
  const empty = document.getElementById('emptyState');
  const info = document.getElementById('resultInfo');

  if (!games.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    info.textContent = '';
    return;
  }
  empty.style.display = 'none';
  info.innerHTML = `Mostrando <b>${games.length}</b> juegos`;

  grid.innerHTML = games.map(g => {
    const score = getScore(g.name);
    const scoreHtml = score
      ? `<div class="score-num">${score.toFixed(1)}</div>`
      : '<span style="color:var(--muted);font-size:11px">N/D</span>';
    return `
    <div class="game-card" onclick="openModal('${g.name.replace(/'/g, "\\'")}')">
      <div class="card-thumb">
        <span>${g.emoji}</span>
        <span class="tier-badge ${tierClass(g.tier)}">${tierLabel(g.tier)}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${g.name}</div>
        <div class="card-genre">${g.genre}</div>
        <div class="card-score">
          <div class="stars">${renderStars(score)}</div>
          ${scoreHtml}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── MODAL ─────────────────────────────────────────────
async function openModal(name) {
  const game = GAMES.find(g => g.name === name);
  if (!game) return;

  const score = getScore(name);
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('open');

  // Set static content
  document.getElementById('modalIcon').innerHTML = `<span style="font-size:28px">${game.emoji}</span>`;
  document.getElementById('modalTitle').textContent = game.name;

  const tagsHtml = `
    <span class="tag genre-tag">${game.genre}</span>
    <span class="tag ${tierClass(game.tier)}">${tierLabel(game.tier)}</span>
    ${game.fps !== '--' ? `<span class="tag">${game.fps} en tu PC</span>` : ''}
  `;
  document.getElementById('modalTags').innerHTML = tagsHtml;

  // Score
  if (score) {
    document.getElementById('modalScore').textContent = score.toFixed(1);
    document.getElementById('modalScore').style.color = scoreColor(score);
    document.getElementById('modalVerdict').textContent = verdictText(score);
    const bar = document.getElementById('scoreBar');
    bar.style.width = '0%';
    bar.style.background = scoreColor(score);
    setTimeout(() => { bar.style.width = `${(score / 10) * 100}%`; }, 100);
  } else {
    document.getElementById('modalScore').textContent = '--';
    document.getElementById('modalVerdict').textContent = 'Sin puntuación registrada';
    document.getElementById('scoreBar').style.width = '0%';
  }

  // FPS badge
  const fpsBadge = document.getElementById('fpsBadge');
  fpsBadge.textContent = game.fps;
  fpsBadge.style.background = {
    excellent: 'rgba(61,220,132,.15)',
    good: 'rgba(245,197,66,.15)',
    bad: 'rgba(255,92,92,.15)',
    unrated: 'rgba(122,131,153,.1)',
  }[game.tier];
  fpsBadge.style.color = {
    excellent: 'var(--green)', good: 'var(--yellow)',
    bad: 'var(--red)', unrated: 'var(--muted)',
  }[game.tier];

  // Load AI description
  const content = document.getElementById('modalContent');

  if (loadedGames.has(name)) {
    content.innerHTML = loadedGames.get(name);
    return;
  }

  content.innerHTML = `<div class="loading-state"><div class="spinner"></div>Generando descripción con IA...</div>`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: `Eres un experto en videojuegos. Responde SOLO en JSON válido, sin markdown, sin texto extra.
El formato exacto es:
{
  "descripcion": "3-4 oraciones en español sobre de qué trata el juego, su atmósfera y por qué es especial",
  "desarrollador": "Nombre del desarrollador o 'Desconocido'",
  "anio": "Año de lanzamiento o 'Desconocido'",
  "jugadores": "Un jugador / Multijugador / Co-op 2-4 jugadores / etc",
  "duracion": "Duración aproximada para completarlo, ej: '8-10 horas' o 'Infinito'",
  "nota_rendimiento": "Una frase sobre cómo corre en hardware integrado AMD Vega 11 con las FPS indicadas"
}`,
        messages: [{
          role: "user",
          content: `Juego: "${name}"\nGénero: ${game.genre}\nFPS en Ryzen 5 3400G Vega 11: ${game.fps}`
        }]
      })
    });

    const data = await response.json();
    const text = data.content?.map(b => b.text || '').join('') || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const info = JSON.parse(clean);

    const perfColor = game.tier === 'excellent' ? 'rgba(61,220,132,.06)' :
                      game.tier === 'good' ? 'rgba(245,197,66,.06)' : 'rgba(255,92,92,.06)';
    const perfBorder = game.tier === 'excellent' ? 'rgba(61,220,132,.2)' :
                       game.tier === 'good' ? 'rgba(245,197,66,.2)' : 'rgba(255,92,92,.2)';

    const html = `
      <p class="modal-description">${info.descripcion}</p>
      <div class="modal-highlights">
        <div class="highlight-item">
          <div class="highlight-label">Desarrollador</div>
          <div class="highlight-value">${info.desarrollador}</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-label">Año</div>
          <div class="highlight-value">${info.anio}</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-label">Jugadores</div>
          <div class="highlight-value">${info.jugadores}</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-label">Duración aprox.</div>
          <div class="highlight-value">${info.duracion}</div>
        </div>
      </div>
      <div class="perf-section" style="background:${perfColor};border-color:${perfBorder}">
        <div class="perf-title">🖥️ Rendimiento en tu PC</div>
        <div class="perf-text">${info.nota_rendimiento}</div>
      </div>
    `;

    loadedGames.set(name, html);
    content.innerHTML = html;

  } catch (err) {
    content.innerHTML = `<p style="color:var(--muted);font-size:14px">No se pudo cargar la descripción. Intenta de nuevo.</p>`;
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

// ── EVENTS ────────────────────────────────────────────
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  renderGrid();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── INIT ─────────────────────────────────────────────
document.getElementById('totalCount').textContent = GAMES.length;
renderGrid();
</script>
</body>
</html>
